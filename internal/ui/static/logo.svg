<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loupe">
  <defs>
    <clipPath id="glass"><circle cx="24" cy="24" r="11.5"/></clipPath>
  </defs>
  <!-- handle (drawn first so the ring sits on top and they read as one piece) -->
  <line x1="34" y1="34" x2="39.5" y2="39.5" stroke="#9B2D43" stroke-width="7.5" stroke-linecap="round"/>
  <line x1="39" y1="39" x2="52" y2="52" stroke="#6E1423" stroke-width="12" stroke-linecap="round"/>
  <line x1="42.5" y1="42.5" x2="49.5" y2="49.5" stroke="#E0556B" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
  <!-- lens ring -->
  <circle cx="24" cy="24" r="17" fill="#9B2D43"/>
  <!-- glass -->
  <circle cx="24" cy="24" r="11.5" fill="#F6E4E8"/>
  <!-- glass highlight -->
  <g clip-path="url(#glass)">
    <path d="M11 29 L29 11" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <path d="M17 32 L32 17" stroke="#fff" stroke-width="2.3" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
