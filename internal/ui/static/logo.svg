<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loupe">
  <defs>
    <linearGradient id="lpBody" x1="8" y1="6" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5384F"/>
      <stop offset="1" stop-color="#6E1423"/>
    </linearGradient>
    <linearGradient id="lpGlass" x1="14" y1="12" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3D7DE"/>
    </linearGradient>
  </defs>
  <!-- handle, drawn first so the lens ring sits on top and they read as one piece -->
  <line x1="39" y1="39" x2="55.5" y2="55.5" stroke="url(#lpBody)" stroke-width="11.5" stroke-linecap="round"/>
  <!-- lens ring -->
  <circle cx="26" cy="26" r="20" fill="url(#lpBody)"/>
  <!-- glass -->
  <circle cx="26" cy="26" r="13" fill="url(#lpGlass)"/>
  <!-- glass highlight -->
  <path d="M17.5 22.5a11 11 0 0 1 8-6" fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" opacity=".9"/>
  <!-- AI spark inside the lens -->
  <path d="M26 17.4c.95 5.15 2.5 6.7 7.65 7.65-5.15.95-6.7 2.5-7.65 7.65-.95-5.15-2.5-6.7-7.65-7.65 5.15-.95 6.7-2.5 7.65-7.65Z"
        fill="#9B2D43"/>
</svg>
